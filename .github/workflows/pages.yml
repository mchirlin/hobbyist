name: Deploy to GitHub Pages

# Builds the Vite app in app/ and publishes it to GitHub Pages.
# The v1 life-list badge is the default route, so the Pages URL is the
# shareable link. Runs on every push to the branch below (change it to `main`
# once main exists), or on demand from the Actions tab.

on:
  push:
    branches: [feat/testable-prototype]
  workflow_dispatch:

# Least-privilege token scoped to what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache here on purpose — a restored corrupt npm cache is itself a
          # known trigger for the "Exit handler never called" reify crash; the
          # Install step manages the cache explicitly instead.

      - name: Pin npm (runner's bundled npm hit "Exit handler never called")
        run: npm install -g npm@10.9.2

      - name: Install
        # npm ci crashed on the runner with "Exit handler never called!" — an
        # npm-internal bug, not a dependency error. Clean the cache and fall
        # back to a fresh install (still lockfile-driven) if ci crashes again.
        run: npm ci || (npm cache clean --force && rm -rf node_modules && npm install --no-audit --no-fund)

      - name: Test (gate the deploy)
        run: npx vitest run

      - name: Build
        env:
          # Pages serves a project site under /<repo>/ — assets must resolve there.
          VITE_BASE: /hobbyist/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
