<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The Hobbyist app icon: a scalloped merit patch with a star.
       Rendered to PNG by generate.mjs. The full-bleed background makes it
       safe as a maskable icon (safe zone is the central 80%). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#f0a84b"/>
      <stop offset="55%" stop-color="#d9822b"/>
      <stop offset="100%" stop-color="#9a4a0f"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- scalloped patch rim: 24 bumps around a circle, drawn as a dashed thick ring -->
  <g fill="none" stroke="#fff2dc" stroke-opacity="0.85" stroke-width="10"
     stroke-linecap="round" stroke-dasharray="2 24.2">
    <circle cx="256" cy="256" r="150"/>
  </g>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#7a3a0c" stroke-width="6" stroke-opacity="0.5"/>
  <!-- five-point star -->
  <path fill="url(#star)" stroke="#8a4a12" stroke-width="4" stroke-linejoin="round"
    d="M256 150
       l27.8 56.3 62.1 9 -44.9 43.8 10.6 61.9 -55.6 -29.2 -55.6 29.2 10.6 -61.9 -44.9 -43.8 62.1 -9 Z"/>
</svg>
