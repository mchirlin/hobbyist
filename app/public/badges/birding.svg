<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Full-color embroidered-style Birding badge (demo of the art pipeline:
       richer than the single-color inline emblem). -->
  <defs>
    <radialGradient id="bsky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a5d8ff"/>
      <stop offset="100%" stop-color="#4dabf7"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bsky)" stroke="#1971c2" stroke-width="3"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- sun -->
  <circle cx="74" cy="28" r="8" fill="#ffd43b"/>
  <!-- bird body -->
  <path d="M28 60 c0 -16 12 -26 26 -26 c8 0 14 3 18 8 l9 -4 l-5 10 c2 4 2 10 0 14 c-6 12 -22 16 -34 10 z"
        fill="#f76707" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wing -->
  <path d="M42 52 q14 -6 26 2 q-12 8 -26 2 z" fill="#e8590c"/>
  <!-- eye + beak -->
  <circle cx="62" cy="46" r="3" fill="#212529"/>
  <path d="M72 47 l10 -3 l-8 7 z" fill="#ffd43b" stroke="#e67700" stroke-width="1"/>
  <!-- tail -->
  <path d="M40 62 l-14 12" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/>
</svg>
