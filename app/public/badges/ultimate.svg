<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Full-color Ultimate (flying disc) badge — demo art-pipeline asset. -->
  <defs>
    <radialGradient id="ufield" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#b2f2bb"/>
      <stop offset="100%" stop-color="#40c057"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#ufield)" stroke="#2b8a3e" stroke-width="3"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- motion streaks -->
  <path d="M14 40 h16 M12 50 h14 M14 60 h16" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- disc -->
  <ellipse cx="56" cy="52" rx="30" ry="13" fill="#e03131" stroke="#c92a2a" stroke-width="2.5"/>
  <ellipse cx="56" cy="47" rx="30" ry="13" fill="#ff8787" stroke="#c92a2a" stroke-width="2.5"/>
  <ellipse cx="56" cy="49" rx="15" ry="6" fill="none" stroke="#fff" stroke-width="2.5"/>
